name: bench-smoke (real A/B campaign)

# Runs a REAL smoke benchmark campaign (1 rep × all tasks × both arms:
# baseline Claude Code vs. Claude Code + Skailr@ref) on a GitHub-hosted
# runner, then publishes the stats/metrics into bench/benchmarks/ and
# pushes to main.
#
# Auth: uses a Claude Code SUBSCRIPTION token (CLAUDE_CODE_OAUTH_TOKEN
# secret), NOT an Anthropic API key. Generate one on an authenticated
# machine with
#   claude setup-token
# and store it as the repo secret CLAUDE_CODE_OAUTH_TOKEN — required, since
# a GitHub-hosted runner has no pre-existing `claude login` session.
#
# Runner: ubuntu-latest (GitHub-hosted). Node 22.x and the `claude` CLI
# (pinned to bench/config.yaml's claude_code_version) are installed by this
# workflow; the harness verifies the live versions match at run time.

on:
  workflow_dispatch:
    inputs:
      skailr_ref:
        description: "Skailr git ref for the skailr arm (default: this checkout's HEAD = latest main)"
        required: false
        default: "HEAD"
      max_campaign_usd:
        description: "Hard cost guard for the whole campaign (USD)"
        required: false
        default: "30"
      reps:
        description: "Repetitions per task per arm (smoke = 1; raise for more statistical power)"
        required: false
        default: "1"

concurrency:
  group: bench-smoke
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # Claude Code subscription auth — NOT an API key.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Checkout (full history + tags so installArm can archive the skailr ref)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install claude CLI pinned to bench/config.yaml's claude_code_version
        run: |
          set -euo pipefail
          version=$(grep -m1 '^claude_code_version:' bench/config.yaml | sed -E 's/^claude_code_version:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/')
          echo "Installing @anthropic-ai/claude-code@${version}"
          npm install -g "@anthropic-ai/claude-code@${version}"

      - name: Preflight — not root, tools present, versions match pinned config
        run: |
          set -euo pipefail
          if [ "$(id -u)" = "0" ]; then
            echo "::error::Runner is root. Claude Code refuses --dangerously-skip-permissions as root."
            exit 1
          fi
          command -v node >/dev/null || { echo "::error::node not found on runner"; exit 1; }
          command -v claude >/dev/null || { echo "::error::claude CLI not found on runner"; exit 1; }
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is not set. Generate one via 'claude setup-token' and store it as a repo secret."
            exit 1
          fi
          echo "node: $(node --version)"
          echo "claude: $(claude --version)"
          # Belt-and-suspenders: ensure no API key sneaks in (we want subscription auth).
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::warning::ANTHROPIC_API_KEY is set; unsetting for this job so subscription auth is used."
          fi

      - name: Run real smoke campaign (all tasks, both arms)
        working-directory: bench
        env:
          ANTHROPIC_API_KEY: ""
        run: |
          set -euo pipefail
          # No --task ⇒ every task in tasks/ ; both arms are the default.
          node src/run.mjs \
            --reps "${{ inputs.reps }}" \
            --skailr-ref "${{ inputs.skailr_ref }}" \
            --max-campaign-usd "${{ inputs.max_campaign_usd }}"

      - name: Verify isolation (no grader path reachable from any fixture)
        working-directory: bench
        run: node src/verify-isolation.mjs

      - name: Publish stats + metrics into bench/benchmarks/
        id: publish
        working-directory: bench
        run: |
          set -euo pipefail
          node scripts/publish-campaign.mjs
          LABEL=$(node -e "console.log(require('./benchmarks/latest.json').label)")
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - name: Commit + push results to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          git add bench/benchmarks
          if git diff --cached --quiet; then
            echo "No new benchmark output to commit."
            exit 0
          fi
          git commit -m "bench: publish campaign ${{ steps.publish.outputs.label }} (baseline vs skailr@${{ inputs.skailr_ref }}) [skip ci]"
          git push origin main
