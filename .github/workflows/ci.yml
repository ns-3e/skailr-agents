name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Lint all workflow files (would have caught the 3399d14 YAML break on day one)
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: Parse install.ps1 with PowerShell's own parser (Windows installer syntax gate)
        run: |
          # shellcheck disable=SC2016  # single quotes are deliberate: $e/$_/$( ) are PowerShell, not shell, expansions
          pwsh -NoProfile -Command '$e=$null; $null=[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "./install.ps1").Path,[ref]$null,[ref]$e); if($e){$e|ForEach-Object{Write-Host "::error file=install.ps1,line=$($_.Extent.StartLineNumber)::$($_.Message)"}; exit 1}; Write-Host "OK: install.ps1 parses cleanly"'

      - name: Check agent name frontmatter matches filename
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            stem=$(basename "$f" .md)
            name=$(grep -m1 '^name:' "$f" | sed 's/^name:[[:space:]]*//')
            if [ "$name" != "$stem" ]; then
              echo "MISMATCH: $f has name=$name expected=$stem"
              fail=1
            fi
          done < <(find .claude/agents -name '*.md' -type f | sort)
          exit $fail

      - name: Doctor — whole-installation health check
        run: node scripts/skailr/doctor.mjs

      - name: Check version consistency (package.json = manifest.json = plugin.json = latest CHANGELOG cut)
        run: |
          set -e
          pkg=$(node -p "require('./package.json').version")
          man=$(node -p "require('./manifest.json').version")
          plg=$(node -p "require('./.claude-plugin/plugin.json').version")
          log=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ')
          echo "package.json=$pkg manifest.json=$man plugin.json=$plg changelog=$log"
          if [ "$pkg" != "$man" ] || [ "$pkg" != "$log" ] || [ "$pkg" != "$plg" ]; then
            echo "FAIL: versions diverge — cut the release in all four together (see CHANGELOG release-cut note)"
            exit 1
          fi

      - name: Check mirror freshness (remirror reproduces the committed tree)
        run: |
          set -e
          bash scripts/remirror.sh
          if ! git diff --quiet; then
            echo "FAIL: .cursor/ mirror, CLAUDE.md, or manifest.json is stale — run ./scripts/remirror.sh and commit the result"
            git diff --stat
            exit 1
          fi
          echo "OK: mirror is fresh"

      - name: Check manifest paths resolve
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(".")
          manifest = json.loads((root / "manifest.json").read_text())
          missing = []
          for a in manifest["artifacts"]:
              for key in ("claude_path", "cursor_path"):
                  p = a.get(key)
                  if not p:
                      continue
                  if not (root / p).exists():
                      missing.append(p)
          if missing:
              print("Missing:", missing)
              sys.exit(1)
          print(f"OK: {len(manifest['artifacts'])} artifacts")
          PY

      - name: Ownership gate fixture
        run: |
          set -e
          node scripts/skailr/check-ownership.mjs --map examples/parallel-api/ownership.json --map-only
          echo "fixture scripts OK"

      - name: Stop-hook fixture (blocking findings gate)
        run: |
          set -e
          TB=$(mktemp -d)
          mkdir -p "$TB/.claude/tmp" "$TB/scripts/skailr"
          cp scripts/skailr/check-blocking-findings.mjs "$TB/scripts/skailr/"
          printf '%s\n' '# Verification report' 'Verdict: NEEDS_FIXES' '' \
            '## Blocking Findings' '1. **CRITICAL — broken thing**: evidence' \
            > "$TB/.claude/tmp/verification-report.md"
          out=$(printf '{"cwd":"%s"}' "$TB" | node "$TB/scripts/skailr/check-blocking-findings.mjs")
          echo "$out" | grep -q '"decision":"block"' || { echo "FAIL: hook did not block on open finding"; exit 1; }
          # second run must NOT block (marker bounds it to one round)
          out2=$(printf '{"cwd":"%s"}' "$TB" | node "$TB/scripts/skailr/check-blocking-findings.mjs")
          [ -z "$out2" ] || { echo "FAIL: hook blocked twice (marker bound broken)"; exit 1; }
          # clean report must never block
          TB2=$(mktemp -d)
          mkdir -p "$TB2/.claude/tmp"
          printf '%s\n' '# Verification report' 'Verdict: SHIP' '' '## Blocking Findings' 'None.' \
            > "$TB2/.claude/tmp/verification-report.md"
          out3=$(printf '{"cwd":"%s"}' "$TB2" | node "$TB/scripts/skailr/check-blocking-findings.mjs")
          [ -z "$out3" ] || { echo "FAIL: hook blocked a clean report"; exit 1; }
          echo "stop-hook fixture OK"

      - name: Install smoke test
        run: |
          set -e
          TMP=$(mktemp -d)
          ./install.sh "$TMP"
          test -f "$TMP/.claude/agents/engineering/engineer.md"
          test -f "$TMP/.claude/agents/engineering/verifier.md"
          test -f "$TMP/.claude/agents/engineering/researcher.md"
          test -f "$TMP/.claude/agents/program/program-architect.md"
          test -f "$TMP/.claude/commands/patch.md"
          test -f "$TMP/.claude/commands/build.md"
          test -f "$TMP/.claude/commands/program.md"
          test -f "$TMP/.claude/commands/map-repo.md"
          test -f "$TMP/.claude/commands/yolo.md"
          test -f "$TMP/.claude/commands/yolo-program.md"
          test -f "$TMP/.claude/skills/maintain-claude-md/SKILL.md"
          test -f "$TMP/.claude/skills/apply-ux-quality/SKILL.md"
          test -f "$TMP/.claude/program/schemas/orientation.template.md"
          test -f "$TMP/.claude/program/schemas/ownership.schema.json"
          test -f "$TMP/.claude/settings.json"
          test -f "$TMP/.claude/intake.md"
          test -f "$TMP/.claude/repo/.gitkeep"
          test -f "$TMP/CLAUDE.md"
          test -f "$TMP/scripts/skailr/check-ownership.mjs"
          test -f "$TMP/scripts/skailr/check-blocking-findings.mjs"
          test -f "$TMP/.cursor/commands/build.md"
          test -f "$TMP/.cursor/commands/patch.md"
          test -f "$TMP/.cursor/rules/intake.mdc"
          test -f "$TMP/.cursor/rules/engineer.mdc"
          # retired 2.x files must never be installed
          test ! -e "$TMP/.claude/teams"
          test ! -e "$TMP/.claude/model-routing.json"
          test ! -e "$TMP/.claude/program/channels"
          test ! -e "$TMP/scripts/skailr/db.mjs"
          ./install.sh "$TMP" | grep -q 'already has'
          rm -rf "$TMP"
          echo "install OK"

      - name: Upgrade retire smoke test (2.x leftovers are removed)
        run: |
          set -e
          TMP=$(mktemp -d)
          # simulate a 2.x install's pack-owned leftovers
          mkdir -p "$TMP/.claude/agents/legal" "$TMP/.claude/teams" \
                   "$TMP/.claude/program/channels" "$TMP/.claude/skills/fit-test" \
                   "$TMP/scripts/skailr/lib" "$TMP/.cursor/rules" \
                   "$TMP/.claude/experts/profiles"
          touch "$TMP/.claude/agents/legal/legal-lead.md" \
                "$TMP/.claude/teams/registry.md" \
                "$TMP/.claude/program/channels/PROTOCOL.md" \
                "$TMP/.claude/skills/fit-test/SKILL.md" \
                "$TMP/.claude/model-routing.json" \
                "$TMP/scripts/skailr/db.mjs" \
                "$TMP/scripts/skailr/lib/db.mjs" \
                "$TMP/.cursor/rules/story-writer.mdc" \
                "$TMP/.claude/experts/profiles/auth-security-expert.md"
          ./install.sh "$TMP" | grep -q 'retired'
          test ! -e "$TMP/.claude/agents/legal"
          test ! -e "$TMP/.claude/teams"
          test ! -e "$TMP/.claude/program/channels"
          test ! -e "$TMP/.claude/skills/fit-test"
          test ! -e "$TMP/.claude/model-routing.json"
          test ! -e "$TMP/scripts/skailr/db.mjs"
          test ! -e "$TMP/scripts/skailr/lib"
          test ! -e "$TMP/.cursor/rules/story-writer.mdc"
          # consumer data must survive
          test -f "$TMP/.claude/experts/profiles/auth-security-expert.md"
          rm -rf "$TMP"
          echo "retire OK"
