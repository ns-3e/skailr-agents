name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check agent name frontmatter matches filename
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            stem=$(basename "$f" .md)
            name=$(grep -m1 '^name:' "$f" | sed 's/^name:[[:space:]]*//')
            if [ "$name" != "$stem" ]; then
              echo "MISMATCH: $f has name=$name expected=$stem"
              fail=1
            fi
          done < <(find .claude/agents -name '*.md' -type f | sort)
          exit $fail

      - name: Check model routing matches active profile
        run: node scripts/skailr/apply-model-routing.mjs --check

      - name: Check manifest paths resolve
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(".")
          manifest = json.loads((root / "manifest.json").read_text())
          missing = []
          for a in manifest["artifacts"]:
              for key in ("claude_path", "cursor_path"):
                  p = a.get(key)
                  if not p:
                      continue
                  if not (root / p).exists():
                      missing.append(p)
          if missing:
              print("Missing:", missing)
              sys.exit(1)
          print(f"OK: {len(manifest['artifacts'])} artifacts")
          PY

      - name: Fixture script gates
        run: |
          set -e
          node scripts/skailr/check-ownership.mjs --map examples/parallel-api/ownership.json --map-only
          node scripts/skailr/check-contracts.mjs --dir examples/parallel-api/contracts --ledger examples/parallel-api/ledger.md
          node scripts/skailr/validate-channels.mjs --dir examples/parallel-api/channels
          node scripts/skailr/emit-stubs.mjs --dir examples/parallel-api/contracts --out /tmp/skailr-stubs
          node scripts/skailr/ledger-status.mjs --ledger examples/parallel-api/ledger.md
          test -f /tmp/skailr-stubs/orders-api.stub.js
          echo "fixture scripts OK"

      - name: Install smoke test
        run: |
          set -e
          TMP=$(mktemp -d)
          ./install.sh "$TMP"
          test -f "$TMP/.claude/program/channels/PROTOCOL.md"
          test -f "$TMP/.claude/agents/engineering/validator.md"
          test -f "$TMP/.claude/commands/continue-feature.md"
          test -f "$TMP/.claude/commands/patch.md"
          test -f "$TMP/.claude/commands/map-repo.md"
          test -f "$TMP/.claude/repo/.gitkeep"
          test -f "$TMP/.claude/program/schemas/orientation.template.md"
          test -f "$TMP/.claude/agents/legal/legal-lead.md"
          test -f "$TMP/.claude/skills/check-ownership/SKILL.md"
          test -f "$TMP/.claude/skills/route-intake/SKILL.md"
          test -f "$TMP/.claude/skills/sync-lineage/SKILL.md"
          test -f "$TMP/.claude/intake.md"
          test -f "$TMP/CLAUDE.md"
          test -f "$TMP/scripts/skailr/check-ownership.mjs"
          test -f "$TMP/.claude/model-routing.json"
          test -f "$TMP/scripts/skailr/apply-model-routing.mjs"
          test -f "$TMP/.cursor/commands/build-feature.md"
          test -f "$TMP/.cursor/commands/patch.md"
          test -f "$TMP/.cursor/commands/map-repo.md"
          test -f "$TMP/.cursor/rules/intake.mdc"
          test -f "$TMP/.cursor/model-routing.md"
          ./install.sh "$TMP" | grep -q 'already has'
          rm -rf "$TMP"
          echo "install OK"
