name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Lint all workflow files (would have caught the 3399d14 YAML break on day one)
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: Check agent name frontmatter matches filename
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            stem=$(basename "$f" .md)
            name=$(grep -m1 '^name:' "$f" | sed 's/^name:[[:space:]]*//')
            if [ "$name" != "$stem" ]; then
              echo "MISMATCH: $f has name=$name expected=$stem"
              fail=1
            fi
          done < <(find .claude/agents -name '*.md' -type f | sort)
          exit $fail

      - name: Check Write-capable roles also grant Edit
        run: node scripts/skailr/check-agent-tools.mjs

      - name: Check prompt efficiency invariants
        run: |
          set -e
          if grep -RsnF 'message board, not a chat' .claude/agents; then
            echo "FAIL: channel protocol must live in PROTOCOL.md only (not inlined in agents)"
            exit 1
          fi
          # shellcheck disable=SC2016  # literal grep -F pattern; the backticks are not command substitution
          if grep -RsnF 'full contents of `story.md`' .claude/commands; then
            echo "FAIL: commands must not paste full story.md into chat"
            exit 1
          fi
          if grep -RsnF 'Take a deep breath' .claude/agents .claude/commands; then
            echo "FAIL: remove Take a deep breath scaffold from agents/commands"
            exit 1
          fi
          if grep -RsnF 'Full vertical slice with real file paths' .claude/agents .claude/program/schemas; then
            echo "FAIL: researcher/orientation must use capped slice format (paths + ≤5 lines)"
            exit 1
          fi
          echo "OK: prompt efficiency invariants"

      - name: Check model routing matches active profile
        run: node scripts/skailr/apply-model-routing.mjs --check

      - name: Check canonical boilerplate blocks identical
        run: node scripts/skailr/check-blocks.mjs

      - name: Doctor — whole-installation health check
        run: node scripts/skailr/doctor.mjs

      - name: Check expert roster valid
        run: node scripts/skailr/check-experts.mjs

      - name: Check version consistency (package.json = manifest.json = latest CHANGELOG cut)
        run: |
          set -e
          pkg=$(node -p "require('./package.json').version")
          man=$(node -p "require('./manifest.json').version")
          plg=$(node -p "require('./.claude-plugin/plugin.json').version")
          log=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ')
          echo "package.json=$pkg manifest.json=$man plugin.json=$plg changelog=$log"
          if [ "$pkg" != "$man" ] || [ "$pkg" != "$log" ] || [ "$pkg" != "$plg" ]; then
            echo "FAIL: versions diverge — cut the release in all four together (see CHANGELOG release-cut note)"
            exit 1
          fi

      - name: Check mirror freshness (remirror reproduces the committed tree)
        run: |
          set -e
          bash scripts/remirror.sh
          if ! git diff --quiet; then
            echo "FAIL: .cursor/ mirror, CLAUDE.md, or manifest.json is stale — run ./scripts/remirror.sh and commit the result"
            git diff --stat
            exit 1
          fi
          echo "OK: mirror is fresh"

      - name: Check manifest paths resolve
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(".")
          manifest = json.loads((root / "manifest.json").read_text())
          missing = []
          for a in manifest["artifacts"]:
              for key in ("claude_path", "cursor_path"):
                  p = a.get(key)
                  if not p:
                      continue
                  if not (root / p).exists():
                      missing.append(p)
          if missing:
              print("Missing:", missing)
              sys.exit(1)
          print(f"OK: {len(manifest['artifacts'])} artifacts")
          PY

      - name: Fixture script gates
        run: |
          set -e
          node scripts/skailr/check-ownership.mjs --map examples/parallel-api/ownership.json --map-only
          node scripts/skailr/check-contracts.mjs --dir examples/parallel-api/contracts --ledger examples/parallel-api/ledger.md
          node scripts/skailr/validate-channels.mjs --dir examples/parallel-api/channels
          node scripts/skailr/emit-stubs.mjs --dir examples/parallel-api/contracts --out /tmp/skailr-stubs
          node scripts/skailr/ledger-status.mjs --ledger examples/parallel-api/ledger.md
          # ticket board smoke (printf, not heredocs — column-0 heredoc bodies
          # terminate a YAML block scalar and killed this workflow file entirely)
          TB=$(mktemp -d)
          mkdir -p "$TB/tickets"
          printf '%s\n' \
            '# Board: CI' '' '## Destination' 'x' '' '## Done' '' \
            '## Not yet specified' '' '## Out of scope' '' '## Tickets' '' \
            '| ID | Title | Role | Status | Blocked by |' \
            '|----|-------|------|--------|------------|' \
            '| T-001 | A | backend | open | |' > "$TB/board.md"
          printf '%s\n' \
            '---' 'id: T-001' 'title: A' 'role: backend' 'status: open' \
            'acs: [AC-1]' 'blocked_by: []' 'ownership:' '  - src/a/**' '---' \
            '' '# Ticket: A' '' '## Resolution' > "$TB/tickets/T-001-a.md"
          node scripts/skailr/ticket-status.mjs validate --root "$TB"
          node scripts/skailr/ticket-status.mjs claim --id T-001 --root "$TB"
          node scripts/skailr/ticket-status.mjs resolve --id T-001 --gist "done" --root "$TB"
          test -f /tmp/skailr-stubs/orders-api.stub.js
          echo "fixture scripts OK"

      - name: Install smoke test
        run: |
          set -e
          TMP=$(mktemp -d)
          ./install.sh "$TMP"
          test -f "$TMP/.claude/program/channels/PROTOCOL.md"
          test -f "$TMP/.claude/agents/engineering/validator.md"
          test -f "$TMP/.claude/commands/continue-feature.md"
          test -f "$TMP/.claude/commands/patch.md"
          test -f "$TMP/.claude/commands/map-repo.md"
          test -f "$TMP/.claude/repo/.gitkeep"
          test -f "$TMP/.claude/program/schemas/orientation.template.md"
          test -f "$TMP/.claude/agents/legal/legal-lead.md"
          test -f "$TMP/.claude/skills/check-ownership/SKILL.md"
          test -f "$TMP/.claude/skills/route-intake/SKILL.md"
          test -f "$TMP/.claude/skills/sync-lineage/SKILL.md"
          test -f "$TMP/.claude/skills/run-ticket-board/SKILL.md"
          test -f "$TMP/.claude/program/schemas/board.template.md"
          test -f "$TMP/.claude/program/schemas/ticket.template.md"
          test -f "$TMP/.claude/intake.md"
          test -f "$TMP/CLAUDE.md"
          test -f "$TMP/scripts/skailr/check-ownership.mjs"
          test -f "$TMP/scripts/skailr/ticket-status.mjs"
          test -f "$TMP/.claude/model-routing.json"
          test -f "$TMP/scripts/skailr/apply-model-routing.mjs"
          test -f "$TMP/.cursor/commands/build-feature.md"
          test -f "$TMP/.cursor/commands/patch.md"
          test -f "$TMP/.cursor/commands/map-repo.md"
          test -f "$TMP/.cursor/rules/intake.mdc"
          test -f "$TMP/.cursor/model-routing.md"
          ./install.sh "$TMP" | grep -q 'already has'
          rm -rf "$TMP"
          echo "install OK"
